name: Build Locus IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build Locus
        run: |
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build"

      - name: Create IPA
        run: |
          mkdir Payload
          cp -R build/Locus.app Payload/
          zip -r Locus.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Locus-IPA
          path: Locus.ipa
